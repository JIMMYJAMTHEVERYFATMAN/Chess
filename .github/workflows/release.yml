name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release version
        shell: pwsh
        run: |
          $source = Get-Content offline_chess/config.py -Raw
          $versionMatch = [regex]::Match($source, '(?m)^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"\r?$')
          if (-not $versionMatch.Success) {
            throw "Could not read APP_VERSION from offline_chess/config.py"
          }
          $version = $versionMatch.Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $releaseTag = "v$version"
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if ($releaseTag -ne "v$version") {
            throw "Release tag $releaseTag must match APP_VERSION v$version"
          }
          "RELEASE_TAG=$releaseTag" | Add-Content $env:GITHUB_ENV

      - name: Install build dependencies
        shell: pwsh
        run: |
          $buildVenv = Join-Path $env:RUNNER_TEMP "offline-chess-build-venv"
          python -m venv $buildVenv
          $buildPython = Join-Path $buildVenv "Scripts/python.exe"
          & $buildPython -m pip install --upgrade pip
          & $buildPython -m pip install PyInstaller==6.22.3 PyQt6==6.9.1 PyQt6-Qt6==6.9.1 python-chess==1.999 chess==1.11.2 "cryptography>=44.0.0,<48.0.0"
          "OFFLINE_CHESS_BUILD_PYTHON=$buildPython" | Add-Content $env:GITHUB_ENV

      - name: Run test suite
        shell: pwsh
        run: '& $env:OFFLINE_CHESS_BUILD_PYTHON -m unittest test_review_analysis test_telemetry -q'

      - name: Configure public check-in collector URL
        shell: pwsh
        env:
          CHECKIN_URL: ${{ vars.OFFLINE_CHESS_CHECKIN_URL }}
        run: |
          if ([string]::IsNullOrWhiteSpace($env:CHECKIN_URL) -or -not $env:CHECKIN_URL.StartsWith('https://')) {
            throw "Set the repository Actions variable OFFLINE_CHESS_CHECKIN_URL to the deployed HTTPS collector URL before building a release."
          }
          $config = ConvertTo-Json -InputObject ($env:CHECKIN_URL.TrimEnd('/')) -Compress
          @"
          # Generated by the release workflow. Do not commit a production collector URL here.
          USAGE_REPORT_URL = $config
          "@ | Set-Content -LiteralPath offline_chess/build_config.py -Encoding utf8

      - name: Download verified Stockfish 19
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "stockfish-windows-x86-64-universal.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip" `
            -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "3c8bf1f9ea66a09350a40df4f632288285ac206d99f33ab5842c408fc30b48a7") {
            throw "Stockfish archive checksum did not match the official release."
          }
          $engineDir = Join-Path $env:RUNNER_TEMP "stockfish"
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $engine = Get-ChildItem -LiteralPath $engineDir -Filter stockfish-windows-x86-64-universal.exe -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Could not find the Stockfish 19 universal executable in the official archive." }
          Copy-Item -LiteralPath $engine.FullName -Destination stockfish.exe -Force
          $stockfishSource = Join-Path $env:RUNNER_TEMP "Stockfish-sf_19-source.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/Stockfish/archive/refs/tags/sf_19.zip" `
            -OutFile $stockfishSource
          $network = Join-Path $env:RUNNER_TEMP "nn-1a298aa575a0.nnue"
          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/networks/raw/refs/heads/master/nn-1a298aa575a0.nnue" `
            -OutFile $network
          $networkHash = (Get-FileHash $network -Algorithm SHA256).Hash.ToLowerInvariant()
          if (-not $networkHash.StartsWith("1a298aa575a0")) {
            throw "Stockfish NNUE source file checksum prefix did not match its published content hash."
          }
          "STOCKFISH_SOURCE=$stockfishSource" | Add-Content $env:GITHUB_ENV
          "STOCKFISH_NETWORK=$network" | Add-Content $env:GITHUB_ENV

      - name: Build single-file application
        shell: pwsh
        run: |
          & $env:OFFLINE_CHESS_BUILD_PYTHON -m PyInstaller --noconfirm --clean --onefile --windowed `
            --name OfflineChess `
            --add-binary "stockfish.exe;." `
            --add-data "openings;openings" `
            main.py

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/OfflineChess.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OfflineChess.exe" | Set-Content dist/OfflineChess.exe.sha256 -Encoding ascii
          Copy-Item -LiteralPath $env:STOCKFISH_SOURCE -Destination dist/Stockfish-sf_19-source.zip
          Copy-Item -LiteralPath $env:STOCKFISH_NETWORK -Destination dist/nn-1a298aa575a0.nnue
          $licenseDir = Join-Path $env:RUNNER_TEMP "offline-chess-license-bundle"
          New-Item -ItemType Directory -Path $licenseDir -Force | Out-Null
          Copy-Item LICENSE, THIRD_PARTY_NOTICES.md -Destination $licenseDir
          Copy-Item -LiteralPath licenses -Destination (Join-Path $licenseDir licenses) -Recurse -Force
          & $env:OFFLINE_CHESS_BUILD_PYTHON tools/collect_third_party_licenses.py (Join-Path $licenseDir 'python-packages')
          Compress-Archive -Path (Join-Path $licenseDir '*') -DestinationPath dist/OfflineChess-licenses.zip -Force

      - name: Publish release and application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          $notesPath = Join-Path $env:RUNNER_TEMP "release-notes.md"
          @'
          ## Install

          1. Download `OfflineChess.exe` from the Assets section below. `OfflineChess.exe.sha256` is provided for checksum verification.
          2. Save the EXE in a folder your Windows account can write to, such as Downloads or a folder under your user profile.
          3. Optional: in PowerShell, run `Get-FileHash .\OfflineChess.exe -Algorithm SHA256` and compare the SHA256 value with the first value in the checksum file.
          4. Double-click `OfflineChess.exe` to start. Python, Stockfish, and the Lichess opening data are bundled; no separate installation is required.

          ## Licenses and source

          Offline Chess is licensed under GNU GPL v3 only. The `OfflineChess-licenses.zip` asset contains the license and third-party notices. This release also provides the matching Stockfish 19 source archive and the NNUE network embedded in the Stockfish binary. The repository's source archive at this release tag contains the Offline Chess source and build instructions.

          The app shows a first-run usage-reporting disclosure. Check-ins are on by default and can be disabled in Profile → Overview. Check-ins contain an install ID, app version, last-seen timestamp, and saved Chess.com username. Bug reports and feature suggestions are sent only when submitted in the app.

          ## How to use

          1. Start a new game and choose a side, or import a PGN from the game controls.
          2. To inspect a completed game, open its review. Step through moves with the move list or navigation controls and use the review and coaching tabs to inspect analysis.
          3. For Chess.com games, open **Profile → Chess.com**, enter your username, and select **Find archives**. Use **Download all months** for the initial import. For later additions, choose **Update downloaded games**; it checks recent archive months and adds games that are not already saved.
          4. Select downloaded games and choose **Review selected** or **Review all unreviewed** to run local Stockfish analysis. In **Castling timing and results**, **Quick scan** reads saved PGNs without a full review; select a castling row to filter the game list to matching games.
          5. In **Profile → Overview**, choose board and piece styles. Opening data and profile files are stored locally under `%LOCALAPPDATA%\OfflineChess`.
          '@ | Set-Content -LiteralPath $notesPath -Encoding utf8
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/OfflineChess.exe dist/OfflineChess.exe.sha256 dist/OfflineChess-licenses.zip dist/Stockfish-sf_19-source.zip dist/nn-1a298aa575a0.nnue --clobber
            gh release edit $env:RELEASE_TAG --notes-file $notesPath
          } else {
            gh release create $env:RELEASE_TAG dist/OfflineChess.exe dist/OfflineChess.exe.sha256 dist/OfflineChess-licenses.zip dist/Stockfish-sf_19-source.zip dist/nn-1a298aa575a0.nnue `
              --title $env:RELEASE_TAG --notes-file $notesPath
          }
