name: Build and publish Windows release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-release:
    runs-on: windows-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check release version
        shell: pwsh
        run: |
          $source = Get-Content main.py -Raw
          $versionMatch = [regex]::Match($source, '(?m)^APP_VERSION = "([0-9]+\.[0-9]+\.[0-9]+)"\r?$')
          if (-not $versionMatch.Success) {
            throw "Could not read APP_VERSION from main.py"
          }
          $version = $versionMatch.Groups[1].Value
          if ($env:GITHUB_EVENT_NAME -eq "workflow_dispatch") {
            $releaseTag = "v$version"
          } else {
            $releaseTag = $env:GITHUB_REF_NAME
          }
          if ($releaseTag -ne "v$version") {
            throw "Release tag $releaseTag must match APP_VERSION v$version"
          }
          "RELEASE_TAG=$releaseTag" | Add-Content $env:GITHUB_ENV

      - name: Install build dependencies
        run: python -m pip install --upgrade pip PyInstaller==6.22.3 PyQt6 python-chess

      - name: Download verified Stockfish 19
        shell: pwsh
        run: |
          $archive = Join-Path $env:RUNNER_TEMP "stockfish-windows-x86-64-universal.zip"
          Invoke-WebRequest `
            -Uri "https://github.com/official-stockfish/Stockfish/releases/download/sf_19/stockfish-windows-x86-64-universal.zip" `
            -OutFile $archive
          $hash = (Get-FileHash $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          if ($hash -ne "3c8bf1f9ea66a09350a40df4f632288285ac206d99f33ab5842c408fc30b48a7") {
            throw "Stockfish archive checksum did not match the official release."
          }
          $engineDir = Join-Path $env:RUNNER_TEMP "stockfish"
          Expand-Archive -LiteralPath $archive -DestinationPath $engineDir -Force
          $engine = Get-ChildItem -LiteralPath $engineDir -Filter stockfish.exe -Recurse | Select-Object -First 1
          if (-not $engine) { throw "Could not find stockfish.exe in the official archive." }
          Copy-Item -LiteralPath $engine.FullName -Destination stockfish.exe -Force

      - name: Build single-file application
        run: >-
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name OfflineChess
          --add-binary "stockfish.exe;."
          --add-data "openings;openings"
          main.py

      - name: Create SHA-256 file
        shell: pwsh
        run: |
          $hash = (Get-FileHash dist/OfflineChess.exe -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  OfflineChess.exe" | Set-Content dist/OfflineChess.exe.sha256 -Encoding ascii

      - name: Publish release and application
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:RELEASE_TAG 2>$null
          if ($LASTEXITCODE -eq 0) {
            gh release upload $env:RELEASE_TAG dist/OfflineChess.exe dist/OfflineChess.exe.sha256 --clobber
          } else {
            gh release create $env:RELEASE_TAG dist/OfflineChess.exe dist/OfflineChess.exe.sha256 `
              --title $env:RELEASE_TAG --generate-notes
          }
